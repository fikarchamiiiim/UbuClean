[project]
name = "ubuclean"
version = "1.0.0"
description = "Pembersih sistem, monitor, dan perawatan untuk Ubuntu Desktop"
requires-python = ">=3.12"
dependencies = ["psutil>=5.9"]

[project.optional-dependencies]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["error::DeprecationWarning:ubuclean.*"]
